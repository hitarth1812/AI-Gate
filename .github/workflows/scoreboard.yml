name: scoreboard

# Produces eval/scoreboard.json for a release on the reference runner (ubuntu-latest, Python 3.12), so the published
# numbers do not depend on one laptop. Started by hand only; it never commits. Download the artifact, commit it with
# `python scripts/gen_accuracy.py --write`, then run `python eval/run.py --update-ratchet` yourself. See docs/dev/RELEASING.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoreboard:
    name: ubuntu-latest / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Evaluation (writes eval/scoreboard.json)
        env:
          EVAL_CACHE: ${{ runner.temp }}/eval-cache
        run: python eval/run.py --jobs 2
      - name: Upload the scoreboard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoreboard-ubuntu-latest-py3.12
          path: eval/scoreboard.json
          if-no-files-found: error
