name: release

# Publishes to PyPI with Trusted Publishing (OIDC): no token, password or secret is used anywhere in this file.
# PyPI project: aigate-lite - repo: hitarth1812/AI-Gate - workflow: release.yml - environment: pypi
# A tag vX.Y.Z builds, tests the wheel, and (after the `pypi` environment is approved) publishes.
# workflow_dispatch builds and tests only; it never publishes. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.dist.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Version guard (the tag must equal __version__)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG=""
          if [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME"; fi
          python scripts/release_check.py tag "$TAG"
      - name: Install the build tools
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Build the sdist and the wheel
        run: python -m build
      - name: twine check
        run: python -m twine check dist/*
      - name: Check the built files (version in the metadata, wheel contents)
        id: dist
        run: |
          VERSION="$(python scripts/release_check.py dist dist)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "built $VERSION"
      - name: SHA-256 of the files that will be uploaded
        run: sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-wheel:
    name: wheel on ${{ matrix.os }} / py${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      # No checkout: the wheel is tested away from the source tree.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the wheel into a clean environment and smoke-test it
        shell: bash
        env:
          EXPECTED: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          case "$RUNNER_OS" in
            Windows) BIN="$RUNNER_TEMP/venv/Scripts"; EXE=".exe" ;;
            *)       BIN="$RUNNER_TEMP/venv/bin"; EXE="" ;;
          esac
          "$BIN/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          echo "--- installed module"
          "$BIN/python" -c "import aigate_lite; print(aigate_lite.__file__)" | tee module.txt
          grep -q "site-packages" module.txt
          echo "--- aigate-lite --version"
          "$BIN/aigate-lite$EXE" --version | tee v1.txt
          grep -q "aigate-lite $EXPECTED" v1.txt
          echo "--- python -m aigate_lite --version"
          "$BIN/python" -m aigate_lite --version | tee v2.txt
          grep -q "aigate-lite $EXPECTED" v2.txt
          echo "--- smoke test in a temporary git repository"
          rm -rf smoke
          mkdir smoke
          cd smoke
          git init -q
          "$BIN/aigate-lite$EXE" setup < /dev/null
          test -f .git/hooks/pre-commit
          test -f .aigate/lite.toml
          test ! -e .aigate/aigate_lite.py       # installed mode: the hooks use the installed tool, no copy
          "$BIN/python" -c "print('KEY = \"AKIA' + 'QWERTYUIOPASDFGH\"')" > leak.py
          git add leak.py
          set +e
          "$BIN/aigate-lite$EXE" check --staged --offline
          CODE=$?
          set -e
          echo "exit code: $CODE"
          test "$CODE" -eq 1

  publish:
    name: publish to PyPI
    needs: [build, test-wheel]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
