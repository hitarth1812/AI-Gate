name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Require git and sh (the hook tests need both)
        if: runner.os == 'Windows'
        run: Get-Command git, sh | Format-Table Name, Source
      - name: Install pinned test tools
        run: python -m pip install -r requirements-dev.txt
      - name: pyflakes
        run: python -m pyflakes aigate_lite.py
      - name: pytest
        run: python -m pytest -q
      - name: Evaluation corpus (the fixed yardstick; fails on any regression against eval/ratchet.json)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python eval/run.py --check --no-write --families real,seeded,adversarial
      - name: Self-scan (the gate on its own repository)
        env:
          AIGATE_PROVENANCE: human
        run: python aigate_lite.py check --all --offline -q
      - name: Benchmark smoke (informational)
        if: matrix.python == '3.12'
        continue-on-error: true
        timeout-minutes: 10
        run: python bench/bench.py --runs 5 --json bench-smoke.json
      - name: Upload benchmark
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.os }}
          path: bench-smoke.json
          if-no-files-found: ignore

  perf-budget:
    name: performance budget (hook scenarios vs the base branch)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
      - name: Budget (a timed row fails when its median AND p95 are both more than 20% slower than the base branch)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python bench/bench.py --against "origin/$BASE_REF" --pairs 40 --budget 20 --json bench-budget.json
      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-budget
          path: bench-budget.json
          if-no-files-found: ignore
