name: Bug report
description: A crash, a wrong exit code, wrong output, or a command that does not work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in a fresh git repository if you can.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, Python and operating system
      description: "`aigate-lite --version`, `python --version`, and Windows / macOS / Linux"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `aigate-lite doctor`
      render: text
