[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aigate-lite"
dynamic = ["version"]
description = "Free, local commit-time gate that checks AI-written code before it is committed or pushed"
readme = "README.md"
authors = [{ name = "Hitarth Khatiwala", email = "hitarthkhatiwala@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["git-hooks", "pre-commit", "ai", "code-review", "security", "supply-chain"]

[project.scripts]
aigate-lite = "aigate_lite:main"
aigate = "aigate_lite:main"

[project.urls]
Homepage = "https://github.com/hitarth1812/AI-Gate"
Repository = "https://github.com/hitarth1812/AI-Gate"

[tool.setuptools]
py-modules = ["aigate_lite"]

[tool.setuptools.dynamic]
version = { attr = "aigate_lite.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
